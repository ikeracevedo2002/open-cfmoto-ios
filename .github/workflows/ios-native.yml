name: iOS native

on:
  push:
    branches: [ios-native]
    paths: ["ios/**", ".github/workflows/ios-native.yml"]
  pull_request:
    paths: ["ios/**", ".github/workflows/ios-native.yml"]

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Build for iOS Simulator
        run: |
          xcodebuild \
            -project ios/OpenCFMoto.xcodeproj \
            -scheme OpenCFMoto \
            -configuration Debug \
            -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO \
            build
